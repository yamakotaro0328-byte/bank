<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>経済マーケット | MinecraftBank</title>
<style>
  :root {
    --bg: #0b0f19;
    --panel: #141b2c;
    --panel-alt: #101625;
    --panel-border: #232c42;
    --text: #eaeefb;
    --text-dim: #8b93a7;
    --accent: #5b8cff;
    --series: #3987e5;
    --div-pos: #e66767;
    --div-neg: #3987e5;
    --grid: #232c42;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; }
  header { padding: 20px 16px 8px; max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px; }
  header h1 { margin: 0; font-size: 22px; }
  header a { color: var(--accent); font-size: 14px; }
  header .updated { color: var(--text-dim); font-size: 12px; margin-left: auto; }
  main { max-width: 1200px; margin: 0 auto; padding: 0 16px 40px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin: 12px 0 20px; }
  .tile { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px; padding: 14px 16px; }
  .tile .label { color: var(--text-dim); font-size: 12px; }
  .tile .value { font-size: 22px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .tile .sub { color: var(--text-dim); font-size: 12px; margin-top: 4px; }
  section { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px; padding: 16px; margin-bottom: 20px; }
  section h2 { margin: 0 0 4px; font-size: 16px; }
  section .desc { color: var(--text-dim); font-size: 12px; margin: 0 0 12px; }
  .flow-row { display: grid; grid-template-columns: minmax(120px, 180px) 1fr minmax(90px, 120px); align-items: center; gap: 8px; padding: 4px 0; font-size: 13px; }
  .flow-row .name { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .flow-row .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--text); }
  .flow-track { position: relative; height: 14px; }
  .flow-track .mid { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--text-dim); opacity: .5; }
  .flow-bar { position: absolute; top: 2px; height: 10px; }
  .flow-bar.pos { left: 50%; background: var(--div-pos); border-radius: 0 4px 4px 0; }
  .flow-bar.neg { right: 50%; background: var(--div-neg); border-radius: 4px 0 0 4px; }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--text-dim); margin-bottom: 8px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
  .chip { background: var(--panel-alt); color: var(--text); border: 1px solid var(--panel-border); border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .filters input { background: var(--panel-alt); color: var(--text); border: 1px solid var(--panel-border); border-radius: 8px; padding: 6px 10px; font-size: 13px; min-width: 0; flex: 1 1 160px; max-width: 260px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .card { background: var(--panel-alt); border: 1px solid var(--panel-border); border-radius: 10px; padding: 10px; cursor: pointer; text-align: left; color: inherit; font: inherit; }
  .card:hover, .card:focus-visible { border-color: var(--accent); outline: none; }
  .card .n { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .p { font-size: 15px; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .card .c { font-size: 12px; color: var(--text-dim); }
  .card svg { display: block; width: 100%; height: 36px; margin-top: 6px; }
  .detail { display: none; }
  .detail.open { display: block; }
  .detail-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; }
  .detail-head .big { font-size: 20px; font-weight: 700; }
  .detail-head button { margin-left: auto; }
  .chart-wrap { position: relative; margin-top: 8px; }
  .chart-wrap svg { width: 100%; height: 260px; display: block; }
  .tooltip { position: absolute; pointer-events: none; background: #0b0f19ee; border: 1px solid var(--panel-border); border-radius: 8px; padding: 6px 8px; font-size: 12px; white-space: nowrap; display: none; }
  .tooltip b { font-variant-numeric: tabular-nums; }
  details { margin-top: 8px; font-size: 13px; }
  details summary { cursor: pointer; color: var(--text-dim); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--panel-border); }
  td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
  .table-scroll { max-height: 260px; overflow: auto; }
  .empty { color: var(--text-dim); font-size: 13px; }
  @media (max-width: 520px) { .flow-row { grid-template-columns: 96px 1fr 84px; } }
</style>
<link rel="stylesheet" href="/bank.css">
<script src="/bank.js" defer></script>
</head>
<body data-page="market">
<header class="page-hero">
  <h1>📈 経済マーケット</h1>
  <span class="updated" id="updated">読み込み中…</span>
</header>
<main>
  <div class="tiles" id="tiles"></div>

  <section>
    <h2>直近24時間のお金の流れ</h2>
    <p class="desc">プレイヤーの所持金がどの処理でどれだけ増減したかの差し引き（お金の台帳より・5分ごとに集計）。</p>
    <div class="legend"><span><i style="background:var(--div-pos)"></i>所持金が増えた（お金が出てきた）</span><span><i style="background:var(--div-neg)"></i>所持金が減った（お金が消えた）</span></div>
    <div id="flows"></div>
  </section>

  <section>
    <h2>資源相場</h2>
    <p class="desc" id="market-desc">カードをクリックすると大きなチャートを表示します。</p>
    <div class="filters" id="filters"></div>
    <div class="detail" id="detail">
      <div class="detail-head">
        <span class="big" id="d-name"></span>
        <span id="d-price"></span>
        <span class="c" id="d-stats"></span>
        <button class="chip" id="d-close" type="button">閉じる</button>
      </div>
      <div class="chart-wrap" id="d-chart-wrap">
        <svg id="d-chart" role="img" aria-label="価格推移チャート"></svg>
        <div class="tooltip" id="d-tip"></div>
      </div>
      <details><summary>表で見る</summary><div class="table-scroll"><table id="d-table"></table></div></details>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const fmtNum = (v) => Number(v).toLocaleString('ja-JP', { maximumFractionDigits: 2 });
const fmtPct = (v) => (v >= 0 ? '▲ +' : '▼ ') + v.toFixed(2) + '%';
let data = null;
let activeCat = 'all';
let query = '';
let selected = null;

function el(tag, attrs = {}, text) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  return e;
}

function tile(label, value, sub) {
  const t = el('div', { class: 'tile' });
  t.append(el('div', { class: 'label' }, label), el('div', { class: 'value' }, value));
  if (sub) t.append(el('div', { class: 'sub' }, sub));
  return t;
}

function remain(ms) {
  if (ms <= 0) return 'まもなく';
  const h = Math.floor(ms / 3600000), m = Math.floor(ms / 60000) % 60;
  return h >= 24 ? `${Math.floor(h / 24)}日${h % 24}時間` : `${h}時間${m}分`;
}

function renderTiles() {
  const box = $('tiles');
  box.replaceChildren();
  box.append(tile('国庫残高', data.treasury_text));
  box.append(tile('銀行預金の合計', data.bank_total_text));
  const tax = data.tax;
  box.append(tile('税収（累計）', tax.revenue_text, tax.enabled ? `取引税 ${(tax.sales_rate * 100).toFixed(2)}%` : '税金は無効'));
  if (tax.enabled) {
    box.append(tile('次の資産税まで', remain(tax.next_wealth_at - Date.now()), `${tax.wealth_threshold_text} 超の ${(tax.wealth_rate * 100).toFixed(2)}% / ${tax.wealth_interval_hours}時間ごと`));
  }
  const lg = data.ledger;
  if (lg) {
    box.append(tile('24時間で出てきたお金', lg.in_text, `${lg.count.toLocaleString()} 件の入出金`));
    box.append(tile('24時間で消えたお金', lg.out_text, `差し引き ${lg.net_text}`));
  }
}

function renderFlows() {
  const box = $('flows');
  box.replaceChildren();
  const lg = data.ledger;
  if (!lg || !lg.sources.length) {
    box.append(el('p', { class: 'empty' }, 'まだ記録がありません（台帳が無効、または集計前です）。'));
    return;
  }
  const max = Math.max(...lg.sources.map((s) => Math.abs(s.net))) || 1;
  for (const s of lg.sources) {
    const row = el('div', { class: 'flow-row', title: `${s.label}: ${s.net_text}（${s.count}件）` });
    const track = el('div', { class: 'flow-track' });
    track.append(el('div', { class: 'mid' }));
    const bar = el('div', { class: 'flow-bar ' + (s.net >= 0 ? 'pos' : 'neg') });
    bar.style.width = Math.max(1, Math.abs(s.net) / max * 50) + '%';
    track.append(bar);
    row.append(el('span', { class: 'name' }, s.label), track, el('span', { class: 'num' }, s.net_text));
    box.append(row);
  }
}

function allItems() {
  return data.categories.flatMap((c) => c.items.map((i) => ({ ...i, cat: c.id, catName: c.name })));
}

function change(item) {
  const h = item.history;
  return h.length >= 2 && h[0] > 0 ? (h[h.length - 1] - h[0]) / h[0] * 100 : 0;
}

function sparkPath(h, w, hgt, pad) {
  const min = Math.min(...h), max = Math.max(...h), span = max - min || 1;
  return h.map((v, i) => `${i ? 'L' : 'M'}${(pad + i / (h.length - 1) * (w - pad * 2)).toFixed(1)},${(hgt - pad - (v - min) / span * (hgt - pad * 2)).toFixed(1)}`).join(' ');
}

function renderFilters() {
  const box = $('filters');
  box.replaceChildren();
  const cats = [{ id: 'all', name: 'すべて' }, ...data.categories];
  for (const c of cats) {
    const b = el('button', { class: 'chip', type: 'button', 'aria-pressed': String(activeCat === c.id) }, c.name);
    b.onclick = () => { activeCat = c.id; renderFilters(); renderGrid(); };
    box.append(b);
  }
  const input = el('input', { type: 'search', placeholder: '品目名で検索', 'aria-label': '品目名で検索' });
  input.value = query;
  input.oninput = () => { query = input.value.trim(); renderGrid(); };
  box.append(input);
}

function renderGrid() {
  const box = $('grid');
  box.replaceChildren();
  const items = allItems().filter((i) => (activeCat === 'all' || i.cat === activeCat) && (!query || i.name.includes(query) || i.id.toLowerCase().includes(query.toLowerCase())));
  if (!items.length) { box.append(el('p', { class: 'empty' }, '該当する品目がありません。')); return; }
  for (const item of items) {
    const card = el('button', { class: 'card', type: 'button', title: `${item.name}（クリックで詳細チャート）` });
    card.append(el('div', { class: 'n' }, item.name), el('div', { class: 'p' }, fmtNum(item.price) + ' /個'));
    card.append(el('div', { class: 'c' }, item.history.length >= 2 ? `${fmtPct(change(item))}（直近${spanText(item.history.length)}）` : 'データ収集中'));
    if (item.history.length >= 2) {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', '0 0 160 36');
      svg.setAttribute('preserveAspectRatio', 'none');
      svg.setAttribute('aria-hidden', 'true');
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', sparkPath(item.history, 160, 36, 3));
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', 'var(--series)');
      path.setAttribute('stroke-width', '2');
      path.setAttribute('vector-effect', 'non-scaling-stroke');
      path.setAttribute('stroke-linejoin', 'round');
      svg.append(path);
      card.append(svg);
    }
    card.onclick = () => { selected = item.id; renderDetail(); $('detail').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); };
    box.append(card);
  }
}

function spanText(points) {
  const min = (points - 1) * data.record_minutes;
  return min >= 60 ? `${Math.round(min / 60)}時間` : `${min}分`;
}

function renderDetail() {
  const detail = $('detail');
  const item = selected && allItems().find((i) => i.id === selected);
  if (!item) { detail.classList.remove('open'); return; }
  detail.classList.add('open');
  $('d-name').textContent = item.name;
  $('d-price').textContent = `現在 ${fmtNum(item.price)} /個（基準 ${fmtNum(item.base)}）`;
  const h = item.history;
  const svg = $('d-chart');
  svg.replaceChildren();
  const table = $('d-table');
  table.replaceChildren();
  if (h.length < 2) {
    $('d-stats').textContent = 'データ収集中（30分ごとに記録）';
    return;
  }
  $('d-stats').textContent = `最高 ${fmtNum(Math.max(...h))} / 最安 ${fmtNum(Math.min(...h))} / 変動 ${fmtPct(change(item))}`;
  const W = svg.clientWidth || 800, H = 260, L = 64, R = 12, T = 12, B = 28;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const min = Math.min(...h), max = Math.max(...h), pad = (max - min) * 0.1 || Math.max(1, max * 0.05);
  const lo = min - pad, hi = max + pad;
  const x = (i) => L + i / (h.length - 1) * (W - L - R);
  const y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const ns = 'http://www.w3.org/2000/svg';
  const mk = (tag, attrs) => { const e = document.createElementNS(ns, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); return e; };
  for (let k = 0; k <= 4; k++) {
    const v = lo + (hi - lo) * k / 4;
    svg.append(mk('line', { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: 'var(--grid)', 'stroke-width': 1 }));
    const t = mk('text', { x: L - 8, y: y(v) + 4, 'text-anchor': 'end', fill: 'var(--text-dim)', 'font-size': 11 });
    t.textContent = fmtNum(v);
    svg.append(t);
  }
  const now = data.generated_at;
  const stepMs = data.record_minutes * 60000;
  const timeAt = (i) => now - (h.length - 1 - i) * stepMs;
  const fmtTime = (ms) => { const d = new Date(ms); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
  for (const i of [0, Math.floor((h.length - 1) / 2), h.length - 1]) {
    const t = mk('text', { x: x(i), y: H - 8, 'text-anchor': i === 0 ? 'start' : i === h.length - 1 ? 'end' : 'middle', fill: 'var(--text-dim)', 'font-size': 11 });
    t.textContent = fmtTime(timeAt(i));
    svg.append(t);
  }
  svg.append(mk('path', { d: h.map((v, i) => `${i ? 'L' : 'M'}${x(i)},${y(v)}`).join(' '), fill: 'none', stroke: 'var(--series)', 'stroke-width': 2, 'stroke-linejoin': 'round' }));
  const cross = mk('line', { y1: T, y2: H - B, stroke: 'var(--text-dim)', 'stroke-width': 1, visibility: 'hidden' });
  const dot = mk('circle', { r: 5, fill: 'var(--series)', stroke: 'var(--panel)', 'stroke-width': 2, visibility: 'hidden' });
  svg.append(cross, dot);
  const hit = mk('rect', { x: L, y: T, width: W - L - R, height: H - T - B, fill: 'transparent' });
  svg.append(hit);
  const tip = $('d-tip');
  const move = (ev) => {
    const rect = svg.getBoundingClientRect();
    const px = (ev.clientX - rect.left) * (W / rect.width);
    const i = Math.max(0, Math.min(h.length - 1, Math.round((px - L) / (W - L - R) * (h.length - 1))));
    cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i)); cross.setAttribute('visibility', 'visible');
    dot.setAttribute('cx', x(i)); dot.setAttribute('cy', y(h[i])); dot.setAttribute('visibility', 'visible');
    tip.replaceChildren(el('div', {}, fmtTime(timeAt(i))), el('b', {}, fmtNum(h[i]) + ' /個'));
    tip.style.display = 'block';
    const left = x(i) / W * rect.width;
    tip.style.left = Math.min(rect.width - tip.offsetWidth - 4, Math.max(4, left + 12)) + 'px';
    tip.style.top = Math.max(0, y(h[i]) / H * rect.height - 40) + 'px';
  };
  hit.addEventListener('pointermove', move);
  hit.addEventListener('pointerleave', () => { tip.style.display = 'none'; cross.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); });
  const head = el('tr');
  head.append(el('th', {}, '日時'), el('th', { class: 'r' }, '価格'));
  table.append(head);
  for (let i = h.length - 1; i >= 0; i--) {
    const tr = el('tr');
    tr.append(el('td', {}, fmtTime(timeAt(i))), el('td', { class: 'r' }, fmtNum(h[i])));
    table.append(tr);
  }
}

$('d-close').onclick = () => { selected = null; renderDetail(); };

async function load() {
  try {
    const res = await fetch('/economy.json', { cache: 'no-store' });
    data = await res.json();
    $('updated').textContent = '更新: ' + new Date(data.generated_at).toLocaleTimeString('ja-JP');
    const total = data.categories.reduce((n, c) => n + c.items.length, 0);
    $('market-desc').textContent = `全 ${total} 品目。${data.record_minutes}分ごとに価格を記録しています。カードをクリックすると大きなチャートを表示します。`;
    renderTiles();
    renderFlows();
    if (!$('filters').childElementCount) renderFilters();
    renderGrid();
    renderDetail();
  } catch (e) {
    $('updated').textContent = '読み込みに失敗しました';
  }
}
load();
setInterval(load, 60000);
window.addEventListener('resize', () => { if (data) renderDetail(); });
</script>
</body>
</html>
